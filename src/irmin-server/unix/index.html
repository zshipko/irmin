<html>
  <head>
    <meta charset="utf-8"/>
    <title>Irmin</title>
    <style>
      body {
        font-family: sans-serif;
      }

      #list { margin: auto; padding: 5px; }
      #list li {
        list-style-type: none;
        margin: 5px;
        padding: 0px;
        border: 1px solid #ddd;
        display: flex;
        clear: both;
      }

      #list li:hover {
        background: #FFFFCC;
        cursor: pointer;
      }

      #list li span {
        display: inline-block;
        padding: 10px;
      }

      #list li span.item-path {
        margin-left: 0px;
      }

      #list li span.item-hash {
        margin-right: 10px;
        font-family: monospace;
        margin-top: auto;
        margin-bottom: auto;
        margin-left: auto;
        vertical-align: middle;
      }

      #list li span.item-kind {
        padding: 2px;
        border: 1px solid #ddd;
        width: 75px;
        height: 20px;
        vertical-align: middle;
        text-align: center;
        margin-top: auto;
        margin-bottom: auto;
        margin-right: 10px;
      }

      #path {
        padding: 5px;
        margin: 5px;
        font-size: 110%%;
        border: 1px solid black;
        width: 50%%;
      }

      #contents {
        padding: 5px;
        margin: 5px;
        font-family: monospace;
      }

      h1, h2 {
        padding: 5px;
        margin: 5px;
      }

      #up, #home, #refresh {
        display: inline-block;
        width: 25px;
        height: 25px;
        padding: 7px;
        margin-top: 6px;
        color: black;
        vertical-align: top;
        text-align: center;
        text-decoration: none;
      }


      #up:hover, #home:hover, #refresh:hover {
        cursor: pointer;
        color: white;
        background: black;
      }

    .no-select {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    .text-select {
      -webkit-user-select: text;
      -moz-user-select: text;
      -ms-user-select: text;
      user-select: text;
    }

    .content-hash {
      font-size: 115%%;
      border: 1px solid #ddd;
      padding: 10px;
      margin-bottom: 20px;
      display: table;
    }
    </style>
  </head>
  <body class="no-select">
    <h1 class="no-select">Irmin Dashboard</h1>
    <h2 class="no-select">
      <a href="/" style="text-decoration: none;">
        <svg id="home" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-house-door-fill" viewBox="0 0 16 16"> <path d="M6.5 14.5v-3.505c0-.245.25-.495.5-.495h2c.25 0 .5.25.5.5v3.5a.5.5 0 0 0 .5.5h4a.5.5 0 0 0 .5-.5v-7a.5.5 0 0 0-.146-.354L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293L8.354 1.146a.5.5 0 0 0-.708 0l-6 6A.5.5 0 0 0 1.5 7.5v7a.5.5 0 0 0 .5.5h4a.5.5 0 0 0 .5-.5z"/> </svg>
      </a>
      <span class="no-select" id="up">&uarr;</span>
      <input id="path" value="%s"/>
      <span class="no-select" id="refresh">&#8635;</span>
    </h2>
    <ul id="list" class="text-select"></ul>
    <div id="contents" class="text-select"></div>
    <script>
      let list = document.getElementById("list");
      let pathInput = document.getElementById("path");
      function makeElem(data){
        var elem = document.createElement("li");
        var path = document.createElement("span");
        var hash = document.createElement("span");
        var kind = document.createElement("span");

        path.classList.add("item-path");
        path.innerHTML = data.path;

        kind.classList.add("item-kind");
        kind.innerHTML = data.kind;

        hash.classList.add("item-hash");
        hash.innerHTML = data.hash;

        elem.appendChild(path);
        elem.appendChild(hash);
        elem.appendChild(kind);

        elem.onclick = function(){
          update(this.firstChild.innerHTML);
        }
        return elem;
      }

      function update(path='') {
        pathInput.value = path;
        fetch(path, {method: 'POST'})
        .then(r => r.json())
        .then(data => {
          list.innerHTML = "";
          document.getElementById("contents").innerHTML = "";
          if (data.contents !== undefined){
            document.getElementById("contents").innerHTML = "<div class='content-hash'>" + data.hash + "</div>" + data.contents;
            return;
          }
          for(var i = 0; i < data.length; i++){
            list.appendChild(makeElem(data[i]));
          }
          history.pushState({path: pathInput.value}, '');
        });
      }

      update();

      pathInput.onkeydown = function(e){
        if (e.keyCode == 13){
          update(e.target.value);
        }
      }

      document.getElementById("up").onclick = function() {
        update(pathInput.value.substring(0, pathInput.value.lastIndexOf('/')));
      }

      document.getElementById("refresh").onclick = function() {
        list.innerHTML = "";
        update(pathInput.value);
      }

      window.onpopstate = function(event){
        update(event.state.path);
      }
    </script>
  </body>
</html>
